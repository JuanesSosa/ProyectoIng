# Nombre de la aplicación (aparece en logs)
spring.application.name=fullstack

# === Conexión a MySQL ===
# Los valores se leen de variables de entorno; si no existen, se usan los de la derecha (solo desarrollo local).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fullstack_ecommerce}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA / Hibernate ===
# update: crea o actualiza tablas según las entidades (no borra datos). En producción usar Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# === CORS ===
# Origen permitido del frontend (puede cambiarse con la variable CORS_ALLOWED_ORIGIN).
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
