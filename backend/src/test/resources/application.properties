# Los tests usan H2 en memoria: no requieren MySQL.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=clave-de-pruebas-que-tiene-mas-de-32-caracteres-123456
app.jwt.expiration-minutes=30
app.cors.allowed-origin=http://localhost:4200
# Los tests de integración usan los usuarios de ejemplo
app.seed.enabled=true
