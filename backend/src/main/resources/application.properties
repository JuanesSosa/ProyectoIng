# Nombre de la aplicación (aparece en logs)
spring.application.name=gestor-notas

# === Conexión a MySQL ===
# Los valores salen de variables de entorno; si no existen se usan los de la derecha (solo desarrollo local).
# createDatabaseIfNotExist=true crea la base "gestor_notas" automáticamente si no existe.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestor_notas?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA / Hibernate ===
# update: crea o actualiza las tablas según las entidades (no borra datos). En producción usar Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Las consultas se resuelven dentro de los servicios (transacciones); no se mantiene la sesión abierta en la vista.
spring.jpa.open-in-view=false

# === Seguridad (JWT) ===
# JWT_SECRET: clave para firmar los tokens (mínimo 32 caracteres). Cambia el valor por defecto fuera de desarrollo.
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-en-produccion-0123456789}
# Duración del token en minutos (al vencer hay que volver a iniciar sesión)
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# === CORS ===
# Origen permitido del frontend (puede cambiarse con la variable CORS_ALLOWED_ORIGIN).
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# === Datos de ejemplo ===
# true: si no hay usuarios, crea 3 usuarios de prueba y un ejemplo académico (grupos, actividades, rúbricas y notas). En producción: SEED_ENABLED=false.
app.seed.enabled=${SEED_ENABLED:true}
